<!DOCTYPE html>
<html lang="pt-BR">


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Minha Loja - ChatGPT</title>


    <link rel="stylesheet" href="styleChatBot.css">
</head>


<body>


    <div class="container">


        <h1>🤖 ChatGPT API</h1>
        <p>Assistente Inteligente</p>


        <div class="campo">
            <label>Chave da API</label>
            <input
                type="password"
                id="apiKey"
                placeholder="Cole aqui sua chave da API">
        </div>


        <div class="campo">
            <label>Mensagem</label>


            <textarea
                id="mensagem"
                rows="6"
                placeholder="Digite sua pergunta..."></textarea>
        </div>


        <button id="btnEnviar">
            Enviar
        </button>


        <div id="resposta">
            A resposta aparecerá aqui...
        </div>


    </div>


    <script src="scriptChat.js"></script>


</body>


</html>
